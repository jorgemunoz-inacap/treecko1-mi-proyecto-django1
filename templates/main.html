<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina inicial de nosotros</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container">
    <div class="row m-5">

        <div class="col-lg-4 col-md-6 col-sm-12">
            <div class="card" style="width: 18rem;">
                <img src="{% static 'images/minecraft.png'%}" class="card-img-top" alt="imagen de Juego">
                <div class="card-body">
                    <h5 class="card-title">Gestion de Juego</h5>
                    <p class="card-text">juego a ver</p>
                    <a href="{% url 'juego_home' %}" class="btn btn-primary">ir al gestor</a>
                </div>
            </div>
        </div>
        <div class="col-lg-4 col-md-6 col-sm-12">
            <div class="card" style="width: 18rem;">
                <img src="{% static 'images/mojang.png'%}" class="card-img-top" alt="imagen de Juego">
                <div class="card-body">
                    <h5 class="card-title">Gestion de Desarrolladora</h5>
                    <p class="card-text">desarrolladora a ver</p>
                    <a href="{% url 'home_desarrolladora' %}" class="btn btn-primary">ir al desarrolladora</a>
                </div>
            </div>
        </div>
    </div>
</div>


    <script src="{% static 'js\bootstrap.bundle.min.js'%}"></script>
</body>
</html>
