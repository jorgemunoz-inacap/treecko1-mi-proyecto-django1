{% extends 'desarrolladora/base.html' %}
{% load static %}
{% block principal %}
<div class="row mt-3">
    <div class="col-9 h3">Mantenedor de desarrolladoras</div>
    <div class="col-3">
        <a href="#" class="btn btn-morado"><i class="bi bi-house-add"></i>&nbsp;&nbsp;&nbsp;&nbsp;Agregar desarrolladora</a>
    </div>
</div>
<div class="row mt-3">
    <div class="col">
        <table class="table table-striped table-hover table-dark">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Creado</th>
                    <th>Selecion</th>
                </tr>
            </thead>
            <tbody>
                {% for desarrolladora in desarrolladoras %}
                <tr>
                    <td>{{ desarrolladora.nombre }}</td>
                    <td>{{ desarrolladora.creado }}</td>
                    <td>
                        <a href="#"  class="text-warning"><i class="bi bi-pencil-square"></i></a>
                        <a href="#"  class="text-danger"><i class="bi bi-trash"></i></a>
                    </td> 
                    {% endfor %}
                </tr>
            </tbody>
        </table>
       
    </div>
</div>
{% endblock %}
